<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimo</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7f2; --dot: #f6dfe4; --panel: #ffffff; --text: #3a2e43; --muted: #8e7f99; --line: #f1e2ea;
    --accent: #7c4ddb; --accent-soft: #efe7ff; --pink: #ff8fb1; --pink-soft: #ffe4ec;
    --user-a: #ffd9e6; --user-b: #e6dcff; --user-text: #3a2e43;
    --warn-bg: #fff4d6; --warn: #8a5a00; --err-bg: #ffe6ea; --err: #b4234a;
    --shadow: 0 8px 24px rgba(124, 77, 219, .08), 0 2px 6px rgba(255, 143, 177, .08);
    --glass: rgba(255, 247, 242, .78);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1726; --dot: #2a2338; --panel: #252036; --text: #f3eefc; --muted: #a99fbf; --line: #352d4a;
      --accent: #c4a6ff; --accent-soft: #33294d; --pink: #ff9fbd; --pink-soft: #3d2638;
      --user-a: #4a2f5c; --user-b: #352f63; --user-text: #f6effd;
      --warn-bg: #3a2f17; --warn: #f5cf7a; --err-bg: #43202c; --err: #ff9db0;
      --shadow: 0 8px 24px rgba(0, 0, 0, .3); --glass: rgba(27, 23, 38, .78); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 15.5px/1.6 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(var(--dot) 1.2px, transparent 1.6px) 0 0 / 22px 22px, var(--bg);
  }
  ::selection { background: var(--pink-soft); }

  /* header */
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo { width: 38px; height: 38px; flex: none; }
  .brand .logo svg { width: 100%; height: 100%; display: block; }
  header h1 { font: 600 22px/1 Fredoka, Nunito, sans-serif; margin: 0; letter-spacing: .3px; background: linear-gradient(90deg, var(--pink), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header small { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header small::before { content: "🕰 "; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 7px 14px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
  button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  button:active { transform: translateY(0) scale(.97); }
  button:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  #new { flex: none; color: var(--accent); }
  #new::before { content: "＋ "; }

  /* conversation */
  main { max-width: 780px; margin: 0 auto; padding: 18px 16px 150px; }
  .turn { margin: 22px 0; animation: pop .35s ease both; }
  .meta { color: var(--muted); font-size: 12px; font-weight: 600; text-align: right; margin: 0 6px 4px; }
  .user {
    margin-left: auto; width: fit-content; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere;
    padding: 10px 16px; border-radius: 22px 22px 6px 22px; color: var(--user-text);
    background: linear-gradient(135deg, var(--user-a), var(--user-b)); box-shadow: var(--shadow);
  }
  .bot {
    position: relative; margin: 12px 0 0 46px; padding: 12px 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px 22px 22px 22px; box-shadow: var(--shadow);
  }
  .bot::before {
    content: ""; position: absolute; left: -46px; top: 0; width: 36px; height: 36px; border-radius: 50%;
    background: var(--pink-soft) var(--mimo) center / 30px no-repeat; border: 2px solid var(--panel); box-shadow: var(--shadow);
  }
  .bot > div:nth-child(2) { overflow-x: auto; } /* wide tables scroll inside; the avatar stays visible */
  .bot p { margin: .5em 0; } .bot ul, .bot ol { margin: .4em 0; padding-left: 1.3em; }
  .bot li::marker { color: var(--pink); }
  .bot strong { color: var(--accent); }
  .bot table { border-collapse: separate; border-spacing: 0; margin: .7em 0; font-size: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .bot th, .bot td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .bot tr:last-child td { border-bottom: 0; }
  .bot th { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
  .bot tr:nth-child(odd) td { background: color-mix(in srgb, var(--pink-soft) 35%, transparent); }
  .bot th strong, .bot td strong { color: inherit; }
  .bot a { color: var(--accent); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent-soft); }
  .bot a:hover { border-bottom-color: var(--pink); }
  .bot a.cite { display: inline-block; border: 0; font-size: 11px; font-weight: 800; line-height: 1.6; padding: 0 7px; margin: 0 1px; border-radius: 999px; background: var(--accent-soft); vertical-align: 1px; }
  .bot a.cite:hover { background: var(--pink-soft); color: var(--text); }
  .bot blockquote { margin: .6em 0; padding: 8px 12px; background: var(--warn-bg); color: var(--warn); border-radius: 14px; }
  .bot code { background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 8px; font-size: .92em; }

  /* live status: paw chips + bouncing dots */
  .status { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .status div { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; max-width: 100%; overflow-wrap: anywhere; animation: pop .25s ease both; }
  .status div::before { content: "🐾 "; }
  .status:not(:empty)::after { content: ""; width: 34px; height: 10px; align-self: center; background: radial-gradient(circle, var(--pink) 3.5px, transparent 4px) 0 50% / 12px 10px repeat-x; animation: bounce 1s ease-in-out infinite; }
  .status:not(:empty) + div:not(:empty) { margin-top: 6px; }

  /* sources, notes, errors */
  .sources { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .sources summary { cursor: pointer; display: inline-block; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 12px; list-style: none; }
  .sources summary::-webkit-details-marker { display: none; }
  .sources summary::before { content: "📚 "; }
  .sources[open] summary { background: var(--pink-soft); color: var(--text); }
  .sources ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .sources li { margin: 4px 0; padding: 6px 10px; border-radius: 12px; background: color-mix(in srgb, var(--accent-soft) 50%, transparent); overflow-wrap: anywhere; }
  .sources li a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .note { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; margin-top: 10px; }
  .note::before { content: "✨ "; }
  .error { background: var(--err-bg); color: var(--err); padding: 8px 12px; border-radius: 14px; font-size: 14px; font-weight: 600; margin-top: 10px; }
  .error::before { content: "😿 "; }
  .error button { margin-left: 8px; padding: 2px 12px; color: var(--err); }

  /* composer */
  form { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2; padding: 22px 16px 16px; background: linear-gradient(to top, var(--bg) 60%, transparent); }
  form .row {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 8px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); transition: border-color .2s ease;
  }
  form .row:focus-within { border-color: var(--pink); }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; color: var(--text); background: transparent; border: 0; padding: 9px 10px; min-height: 42px; max-height: 160px; }
  textarea:focus-visible { outline: none; }
  textarea::placeholder { color: var(--muted); }
  button.primary {
    flex: none; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 0; color: #fff;
    background: linear-gradient(135deg, var(--pink), #a07bf0);
  }
  button.primary svg { width: 20px; height: 20px; }

  /* empty state */
  .empty { text-align: center; margin-top: 12vh; color: var(--muted); }
  .empty .hero { width: 96px; height: 96px; margin: 0 auto 10px; animation: float 3.2s ease-in-out infinite; }
  .empty .hero svg { width: 100%; height: 100%; }
  .empty h2 { font: 600 26px/1.2 Fredoka, Nunito, sans-serif; color: var(--text); margin: 0 0 6px; }
  .empty p { margin: 0 auto; max-width: 430px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
  .chips button { font-size: 14px; font-weight: 700; color: var(--accent); background: var(--panel); }
  .chips button:hover { background: var(--pink-soft); color: var(--text); }

  .flash { border-radius: 22px; animation: glow 1.6s ease; }

  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(-3px); opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes glow { 0%, 60% { box-shadow: 0 0 0 4px var(--pink), 0 0 24px var(--pink); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  @media (max-width: 520px) {
    body { font-size: 15px; }
    header h1 { font-size: 20px; }
    .brand .logo { width: 32px; height: 32px; }
    .user { max-width: 90%; }
    .bot { margin-left: 36px; padding: 10px 14px; }
    .bot::before { left: -36px; width: 30px; height: 30px; background-size: 24px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" id="logo" aria-hidden="true"></span><h1>Mimo</h1><small id="zone"></small></div>
  <button id="new">New chat</button>
</header>
<main id="log"></main>
<form id="f">
  <div class="row">
    <textarea id="q" rows="1" placeholder="Ask Mimo anything… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="primary" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
</form>
<script>
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const locale = navigator.language || 'en-US';
const $ = (id) => document.getElementById(id);
$('zone').textContent = tz;

// Mimo the cat: one drawing for the logo, the reply avatar and the tab icon.
const MIMO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <path d="M11 30 L9 7 L29 18 Z" fill="#ffc4b0"/><path d="M53 30 L55 7 L35 18 Z" fill="#ffc4b0"/>
  <path d="M14 25 L13 13 L24 19 Z" fill="#ff9fb6"/><path d="M50 25 L51 13 L40 19 Z" fill="#ff9fb6"/>
  <ellipse cx="32" cy="37" rx="24" ry="21" fill="#ffd9cc"/>
  <ellipse cx="23" cy="36" rx="3.2" ry="4.2" fill="#3d2c3e"/><ellipse cx="41" cy="36" rx="3.2" ry="4.2" fill="#3d2c3e"/>
  <circle cx="24.2" cy="34.4" r="1.2" fill="#fff"/><circle cx="42.2" cy="34.4" r="1.2" fill="#fff"/>
  <ellipse cx="16.5" cy="44" rx="4.2" ry="2.6" fill="#ff8fb1" opacity=".55"/><ellipse cx="47.5" cy="44" rx="4.2" ry="2.6" fill="#ff8fb1" opacity=".55"/>
  <path d="M30.5 40.5 h3 l-1.5 1.8 z" fill="#ff7aa2"/>
  <path d="M28 43.5 q2 2.6 4 0 q2 2.6 4 0" fill="none" stroke="#3d2c3e" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;
if (matchMedia('(max-width: 520px)').matches) $('q').placeholder = 'Ask Mimo anything…'; // the Enter hint wraps on phones
const mimoUrl = 'data:image/svg+xml,' + encodeURIComponent(MIMO_SVG);
$('logo').innerHTML = MIMO_SVG;
$('favicon').href = mimoUrl;
document.documentElement.style.setProperty('--mimo', `url("${mimoUrl}")`);

const SUGGESTIONS = ['What did we talk about last week?', 'Did we discuss IPL?', 'Has anything changed since Monday?', 'What is the latest Node.js LTS?'];
function showEmpty() {
  const box = el('div', 'empty');
  box.id = 'empty';
  box.innerHTML = `<div class="hero" aria-hidden="true">${MIMO_SVG}</div><h2>Hi, I'm Mimo!</h2>
    <p>Ask me anything. I search the web, cite my sources, and remember what we talked about and when.</p>
    <div class="chips">${SUGGESTIONS.map((s) => `<button type="button">${esc(s)}</button>`).join('')}</div>`;
  box.querySelectorAll('.chips button').forEach((b) => (b.onclick = () => { $('q').value = b.textContent; $('q').focus(); }));
  $('log').append(box);
}

const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const params = new URLSearchParams(location.search);
let convId = params.get('conv') || store.get('mimo.conv') || uid();
store.set('mimo.conv', convId);
// One ID per browser groups all of this person's chats, so memory questions can reach earlier chats.
const userId = params.get('user') || store.get('mimo.user') || uid();
store.set('mimo.user', userId);
// Every chat this browser has used, sent along so the server can attach older chats to this user.
const knownConvs = () => { try { return JSON.parse(store.get('mimo.convs') || '[]'); } catch { return []; } };
const rememberConv = (id) => store.set('mimo.convs', JSON.stringify([id, ...knownConvs().filter((c) => c !== id)].slice(0, 50)));
rememberConv(convId);
let current = null; // { controller }

// ---- tiny markdown: escape first, then links, bold, code, lists, tables, quotes ----
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  return esc(s)
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|#turn-|\/\?conv=)[^)\s]+)\)/g, (_, t, u) => {
      const cite = /^(\d+|↩.*)$/.test(t);
      // A link into another chat keeps the ?user= override (demo), placed before the #turn anchor.
      if (u.startsWith('/?conv=') && params.get('user')) u = u.replace(/(#|$)/, '&user=' + encodeURIComponent(params.get('user')) + '$1');
      const ext = u.startsWith('http');
      return `<a ${cite ? 'class="cite"' : ''} href="${u}" ${ext ? 'target="_blank" rel="noopener"' : ''}>${cite && !t.startsWith('↩') ? `[${t}]` : t}</a>`;
    })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function md(src) {
  const lines = src.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const row = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => inline(c.trim().replace(/\\\|/g, '|')));
      let html = '<table><tr>' + row(l).map((c) => `<th>${c}</th>`).join('') + '</tr>'; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += '<tr>' + row(lines[i]).map((c) => `<td>${c}</td>`).join('') + '</tr>'; i++; }
      out.push(html + '</table>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); let html = ordered ? '<ol>' : '<ul>';
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { html += `<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`; i++; }
      out.push(html + (ordered ? '</ol>' : '</ul>')); continue;
    }
    if (/^>\s?/.test(l)) { out.push(`<blockquote>${inline(l.replace(/^>\s?/, ''))}</blockquote>`); i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<p><strong>${inline(h[2])}</strong></p>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    let para = l; i++;
    while (i < lines.length && lines[i].trim() && !/^\s*([-*]|\d+\.|\||>|#)/.test(lines[i])) para += '\n' + lines[i++];
    out.push(`<p>${inline(para).replace(/\n/g, '<br>')}</p>`);
  }
  return out.join('');
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const fmtTime = (iso) => new Date(iso).toLocaleString(locale, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function addTurn(text, ts, id) {
  $('empty')?.remove();
  const wrap = el('section', 'turn'); if (id) wrap.id = 'turn-' + id;
  wrap.append(el('div', 'meta', fmtTime(ts || new Date().toISOString())), el('div', 'user'));
  wrap.querySelector('.user').textContent = text;
  const bot = el('div', 'bot');
  const status = el('div', 'status'); const body = el('div'); const sources = el('div');
  bot.append(status, body, sources); wrap.append(bot);
  $('log').append(wrap);
  return { wrap, bot, status, body, sources, raw: '', srcs: new Map() };
}

function renderSources(view) {
  if (!view.srcs.size) { view.sources.innerHTML = ''; return; }
  const items = [...view.srcs.values()].map((s) => `<li>[${esc(s.id.slice(1))}] <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>${s.pageDate ? ` · ${esc(s.pageDate)}` : ' · undated'}</li>`).join('');
  view.sources.innerHTML = `<details class="sources"><summary>${view.srcs.size} source${view.srcs.size > 1 ? 's' : ''}</summary><ul>${items}</ul></details>`;
}

async function send(text, turnId, view) {
  if (current) current.controller.abort(); // the server also aborts the older run
  const controller = new AbortController(); current = { controller };
  view.wrap.id = 'turn-' + turnId;
  view.body.innerHTML = ''; view.raw = ''; view.status.innerHTML = '';
  view.bot.querySelectorAll('.error,.note').forEach((n) => n.remove());
  let finished = false;
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ convId, userId, knownConvs: knownConvs(), turnId, text, tz, locale }), signal: controller.signal });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const data = chunk.split('\n').find((l) => l.startsWith('data: '));
        if (!data) continue;
        const e = JSON.parse(data.slice(6));
        if (e.type === 'status') view.status.append(el('div', '', esc(e.text)));
        else if (e.type === 'sources') { e.sources.forEach((s) => view.srcs.set(s.url, s)); renderSources(view); }
        else if (e.type === 'token') { view.raw += e.text; view.body.innerHTML = md(view.raw); }
        else if (e.type === 'note') view.bot.append(el('div', 'note', esc(e.text)));
        else if (e.type === 'done') { finished = true; view.status.innerHTML = ''; }
        else if (e.type === 'error') { finished = true; showError(view, e.message, text, turnId); }
      }
      window.scrollTo(0, document.body.scrollHeight);
    }
    if (!finished) showError(view, 'The connection dropped before the answer finished.', text, turnId);
  } catch (err) {
    if (err.name !== 'AbortError') showError(view, err.message, text, turnId);
  } finally {
    if (current?.controller === controller) current = null;
  }
}

function showError(view, message, text, turnId) {
  view.status.innerHTML = '';
  const e = el('div', 'error', esc(message));
  const retry = el('button', '', 'Retry');
  retry.onclick = () => send(text, turnId, view); // same turn ID: the server returns the stored result if it has one
  e.append(retry); view.bot.append(e);
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history?convId=' + encodeURIComponent(convId));
    const { turns } = await res.json();
    if (!turns.length) showEmpty();
    for (const t of turns) {
      const v = addTurn(t.user, t.ts, t.id);
      if (t.status === 'complete') { v.body.innerHTML = md(t.assistant || ''); t.sources.forEach((s) => v.srcs.set(s.url, s)); renderSources(v); }
      else v.bot.append(el('div', 'error', t.status === 'cancelled' ? 'Stopped: replaced by a newer message.' : 'This answer did not finish.'));
    }
    // Opened from a link to a turn in this chat: scroll to it and highlight it.
    const target = location.hash.startsWith('#turn-') && document.querySelector(location.hash);
    if (target) { target.scrollIntoView({ block: 'center' }); target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 2000); }
    else window.scrollTo(0, document.body.scrollHeight);
  } catch {
    if (!$('log').children.length) showEmpty();
  }
}

$('f').onsubmit = (ev) => {
  ev.preventDefault();
  const text = $('q').value.trim(); if (!text) return;
  $('q').value = ''; $('q').style.height = '';
  send(text, uid(), addTurn(text));
};
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });
$('q').addEventListener('input', (e) => { e.target.style.height = ''; e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px'; });
$('new').onclick = () => { if (current) current.controller.abort(); convId = uid(); store.set('mimo.conv', convId); rememberConv(convId); $('log').innerHTML = ''; showEmpty(); };
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#turn-"]'); if (!a) return;
  e.preventDefault(); const t = document.querySelector(a.getAttribute('href'));
  if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1500); }
});
loadHistory();
</script>
</body>
</html>
