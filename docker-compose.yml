# Postgres for Mimo's conversation history. `npm run db:up` / `npm run db:down`.
services:
  db:
    image: postgres:18.6
    container_name: mimo-postgres
    environment:
      POSTGRES_USER: mimo
      POSTGRES_PASSWORD: mimo
      POSTGRES_DB: mimo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mimo-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimo -d mimo"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mimo-pg:
